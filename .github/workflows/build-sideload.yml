name: Build iOS IPA & Android APK for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/build-sideload.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Install dependencies
        run: cd packages/mobile && pnpm install --force || true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'
          ndk: '27.1.12297006'
      
      - name: Build Android APK
        working-directory: packages/mobile
        run: |
          npx expo prebuild --clean --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/release/
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Install dependencies
        run: cd packages/mobile && pnpm install --force || true
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Build iOS IPA
        working-directory: packages/mobile
        run: |
          npx expo prebuild --clean --platform ios
          cd ios
          xcodebuild -workspace CommonGround.xcworkspace \
            -scheme CommonGround \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            -archivePath build/CommonGround.xcarchive \
            archive
          mkdir -p build/ipa/Payload
          cp -R build/CommonGround.xcarchive/Products/Applications/CommonGround.app build/ipa/Payload/
          cd build/ipa
          zip -r CommonGround.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: packages/mobile/ios/build/ipa/
          retention-days: 30

  upload-to-artifacts:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate metadata
        id: metadata
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BUILD_DIR="build-${{ github.run_number }}-${TIMESTAMP}-${COMMIT_SHORT}"
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "build_dir=${BUILD_DIR}" >> $GITHUB_OUTPUT
      
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android
      
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./artifacts/ios
      
      - name: Create build summary
        run: |
          mkdir -p sideload-builds/${{ steps.metadata.outputs.build_dir }}
          cp ./artifacts/android/app-release.apk sideload-builds/${{ steps.metadata.outputs.build_dir }}/CommonGround-${{ steps.metadata.outputs.timestamp }}.apk
          cp ./artifacts/ios/CommonGround.ipa sideload-builds/${{ steps.metadata.outputs.build_dir }}/CommonGround-${{ steps.metadata.outputs.timestamp }}.ipa
          
          cat > sideload-builds/${{ steps.metadata.outputs.build_dir }}/BUILD_INFO.txt << 'BUILD_INFO'
          CommonGround Sideload Build
          
          Build #: ${{ github.run_number }}
          Commit: ${{ github.sha }}
          Commit Short: ${{ steps.metadata.outputs.commit_short }}
          Timestamp: ${{ steps.metadata.outputs.timestamp }}
          Attempt: ${{ github.run_attempt }}
          
          INSTALLATION INSTRUCTIONS
          
          Android (APK):
          - Sideloadly: Connect device → drag & drop APK
          - ADB: adb install CommonGround-*.apk
          - F-Droid: Add as local repository
          
          iOS (IPA):
          - AltStore: Sideload via app
          - Sideloadly: Connect device → select IPA
          - Xcode: Window → Devices → drag & drop IPA
          BUILD_INFO
      
      - name: Upload to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sideload-build-${{ steps.metadata.outputs.build_dir }}
          path: sideload-builds/${{ steps.metadata.outputs.build_dir }}/
          retention-days: 30
      
      - name: Summary
        run: |
          echo "✅ Build Complete"
          echo "Build #: ${{ github.run_number }}"
          echo "Timestamp: ${{ steps.metadata.outputs.timestamp }}"
          echo "Commit: ${{ steps.metadata.outputs.commit_short }}"
          echo ""
          echo "Artifacts available in Actions → Artifacts tab"
          echo "Download: sideload-build-${{ steps.metadata.outputs.build_dir }}"
