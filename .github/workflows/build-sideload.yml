name: Build iOS IPA & Android APK for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/*)�
      - '.github/workflows/build-sideload.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Install dependencies
        run: cd packages/mobile && pnpm install --force || true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'
          ndk: '27.1.12297006'
      
      - name: Build Android APK
        working-directory: packages/mobile
        run: |
          npx expo prebuild --clean --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/release/
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Install dependencies
        run: cd packages/mobile && pnpm install --force || true
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Build iOS IPA
        working-directory: packages/mobile
        run: |
          npx expo prebuild --clean --platform ios
          cd ios
          xcodebuild -workspace CommonGround.xcworkspace \
            -scheme CommonGround \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            -archivePath build/CommonGround.xcarchive \
            archive
          mkdir -p build/ipa/Payload
          cp -R build/CommonGround.xcarchive/Products/Applications/CommonGround.app build/ipa/Payload/
          cd build/ipa
          zip -r CommonGround.ipa Payload
          rm -rf Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: packages/mobile/ios/build/ipa/
          retention-days: 30

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate build metadata
        id: metadata
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TAG_NAME="sideload-${{ github.run_number }}-${TIMESTAMP}-${COMMIT_SHORT}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
      
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android
      
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./artifacts/ios
      
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          release_name: Sideload Build #${{ github.run_number }} (${{ steps.metadata.outputs.timestamp }})
          body: |
            # CommonGround Sideload Build
            
            **Build Details**
            - Run #: `${{ github.run_number }}`
            - Commit: [`${{ steps.metadata.outputs.commit_short }}`](https://github.com/BmdaDaee/AxMCommonGround/commit/${{ github.sha }})
            - Timestamp: `${{ steps.metadata.outputs.timestamp }}`
            - Attempt: `${{ github.run_attempt }}`
            
            **Installation Instructions**
            
            ### Android (APK)
            - **Sideloadly**: Connect device → drag & drop APK
            - **ADB**: `adb install CommonGround.apk`
            - **F-Droid**: Add as local repository
            
            ### iOS (IPA)
            - **AltStore**: Sideload via app
            - **Sideloadly**: Connect device → select IPA
            - **Xcode**: Window → Devices → drag & drop IPA
            
            ---
            *Sideload builds are for development and testing. Not for production distribution.*
          draft: false
          prerelease: true
      
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/android/release/app-release.apk
          asset_name: CommonGround-${{ steps.metadata.outputs.timestamp }}.apk
          asset_content_type: application/vnd.android.package-archive
      
      - name: Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/ios/CommonGround.ipa
          asset_name: CommonGround-${{ steps.metadata.outputs.timestamp }}.ipa
          asset_content_type: application/octet-stream

  cleanup-old-releases:
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Clean up old sideload releases (keep last 10)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKET }}
        run: |
          # Get all sideload releases, sorted by creation date
          RELEASES=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '.[] | select(.tag_name | startswith("sideload-")) | .id' | tail -n +11)
          
          # Delete releases beyond the 10 most recent
          for RELEASE_ID in $RELEASES; do
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted release $RELEASE_ID"
          done
