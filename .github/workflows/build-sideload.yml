name: Build iOS IPA & Android APK for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/build-sideload.yml'

env:
  EXPO_DEBUG: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
          ndk: '26.3.11579264'
      
      - name: Prebuild Android
        working-directory: packages/mobile
        run: npx expo prebuild --clean --platform android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          EAS_BUILD: 'true'
      
      - name: Debug - List gradle files
        run: ls -la packages/mobile/android/ | grep -E "gradle|build"
      
      - name: Build Android APK
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tail -100
      
      - name: Debug - List APK output
        run: find packages/mobile/android -name "*.apk" -type f 2>/dev/null || echo "No APK found yet"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

  build-ios:
    runs-on: macos-13
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'
      
      - name: Prebuild iOS
        working-directory: packages/mobile
        run: npx expo prebuild --clean --platform ios
        env:
          EAS_BUILD: 'true'
      
      - name: Debug - List Xcode workspaces
        run: find packages/mobile/ios -name "*.xcworkspace" -type d
      
      - name: Install CocoaPods
        working-directory: packages/mobile/ios
        run: |
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi
      
      - name: Build iOS Archive
        working-directory: packages/mobile/ios
        run: |
          xcodebuild -workspace CommonGround.xcworkspace \
            -scheme CommonGround \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/CommonGround.xcarchive \
            -verbose \
            archive
      
      - name: Export IPA
        working-directory: packages/mobile/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CommonGround.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ../ExportOptions.plist \
            -verbose
      
      - name: Debug - List IPA output
        run: find packages/mobile/ios/build/ipa -name "*.ipa" -type f 2>/dev/null || echo "No IPA found"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: packages/mobile/ios/build/ipa/CommonGround.ipa
          if-no-files-found: warn
          retention-days: 30

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Debug - List downloaded files
        run: find ./artifacts -type f
      
      - name: Rename artifacts for release
        run: |
          mkdir -p release
          cp artifacts/android-apk/app-release.apk release/CommonGround.apk || true
          cp artifacts/ios-ipa/CommonGround.ipa release/CommonGround.ipa || true
          ls -la release/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sideload-${{ github.run_number }}
          name: Sideload Build ${{ github.run_number }}
          body: |
            # CommonGround Sideload Build
            
            Download the APK and IPA files below for sideloading:
            - **Android APK**: Use with Sideloadly or ADB
            - **iOS IPA**: Use with AltStore, Sideloadly, or Xcode
          files: |
            release/CommonGround.apk
            release/CommonGround.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
