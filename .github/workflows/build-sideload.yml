name: Build iOS IPA & Android APK for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - '.github/workflows/build-sideload.yml'

env:
  EXPO_DEBUG: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
          ndk: '26.3.11579264'
      
      - name: Prebuild Android
        working-directory: packages/mobile
        run: npx expo prebuild --clean --platform android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          EAS_BUILD: 'true'
      
      - name: Build Android APK
        working-directory: packages/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tail -50
      
      - name: Check APK exists
        run: |
          if [ -f "packages/mobile/android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK found"
            ls -lh packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          else
            echo "APK not found at expected path"
            find packages/mobile/android -name "*.apk" -type f || true
          fi
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk

  build-ios:
    runs-on: macos-13
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'
      
      - name: Prebuild iOS
        working-directory: packages/mobile
        run: npx expo prebuild --clean --platform ios
        env:
          EAS_BUILD: 'true'
      
      - name: Check CocoaPods
        working-directory: packages/mobile/ios
        run: |
          if [ -f "Podfile" ]; then
            echo "Running pod install..."
            pod install --repo-update
          else
            echo "No Podfile found, skipping pod install"
          fi
      
      - name: Build iOS Archive
        working-directory: packages/mobile/ios
        run: |
          xcodebuild -workspace CommonGround.xcworkspace \
            -scheme CommonGround \
            -configuration Release \
            -derivedDataPath build \
            -archivePath build/CommonGround.xcarchive \
            archive
      
      - name: Export IPA
        working-directory: packages/mobile/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CommonGround.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ../ExportOptions.plist
      
      - name: Check IPA exists
        run: |
          if [ -f "packages/mobile/ios/build/ipa/CommonGround.ipa" ]; then
            echo "IPA found"
            ls -lh packages/mobile/ios/build/ipa/CommonGround.ipa
          else
            echo "IPA not found at expected path"
            find packages/mobile/ios/build -name "*.ipa" -type f || true
          fi
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: packages/mobile/ios/build/ipa/CommonGround.ipa

  create-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./download-artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release
          if [ -f "download-artifacts/android-apk/app-release.apk" ]; then
            cp download-artifacts/android-apk/app-release.apk release/CommonGround.apk
            echo "APK ready"
          fi
          if [ -f "download-artifacts/ios-ipa/CommonGround.ipa" ]; then
            cp download-artifacts/ios-ipa/CommonGround.ipa release/CommonGround.ipa
            echo "IPA ready"
          fi
          ls -la release/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: sideload-${{ github.run_number }}
          name: Sideload Build ${{ github.run_number }}
          body: |
            # CommonGround Sideload Build ${{ github.run_number }}
            
            Automated build of iOS IPA and Android APK for sideloading.
            
            **Downloads:**
            - **Android APK**: Use with Sideloadly, ADB, or F-Droid
            - **iOS IPA**: Use with AltStore, Sideloadly, or Xcode
          files: |
            release/CommonGround.apk
            release/CommonGround.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
