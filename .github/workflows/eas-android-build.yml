name: EAS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggers

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: cd ../.. && pnpm install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (sideload)
        run: eas build --platform android --profile sideload --non-interactive --no-wait

      - name: Post build link
        run: |
          echo "✅ EAS Build triggered successfully!"
          echo "Check build status at: https://expo.dev/accounts/cursedanomaly/projects/commonground/builds"
